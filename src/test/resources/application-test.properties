# OpenTelemetry is not available during tests, so provide a placeholder endpoint and
# disable all exporters to avoid connection attempts.
OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
OTEL_LOG_ENABLED=false
otel.sdk.disabled=true
management.opentelemetry.logging.export.enabled=false
management.opentelemetry.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.tracing.export.enabled=false